# Unbind default prefix and set a new prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Enable mouse support
set -g mouse on

# Use vi-style key bindings
set -g mode-keys vi

# Increase history limit
set -g history-limit 30000

# Start windows and panes at 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Reduce escape time delay for responsiveness
set -s escape-time 0

# Open new panes in the current directory
bind % split-window -v -c "#{pane_current_path}"
bind '"' split-window -h -c "#{pane_current_path}"


# Copy-mode vi bindings
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Pane navigation using hjkl
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with Alt + hjkl
bind -T copy-mode-vi M-h resize-pane -L 2
bind -T copy-mode-vi M-j resize-pane -D 2
bind -T copy-mode-vi M-k resize-pane -U 2
bind -T copy-mode-vi M-l resize-pane -R 2


# Default status line style
set -g status-style default

# Status line lengths
set -g status-right-length 100
set -g status-left-length 100

# Custom status line modules
# Session
set -g @modBG "#3a3c4e"
set -g @iconFG2 "#16a6ca"
set -g @txtFG "#eaeaea"
set -g status-left "#[fg=#{@modBG}] #[fg=#{@iconFG2},bg=#{@modBG}] #[fg=#{@txtFG},bg=#{@modBG}] #S #[fg=#{@modBG},bg=default] "

# Directory
set -g @iconFG1 "#3ed80f"
set -g status-right "#[fg=#{@modBG}]#[fg=#{@iconFG1},bg=#{@modBG}]#[fg=#{@txtFG},bg=#{@modBG}] #{b:pane_current_path} #[fg=#{@modBG},bg=default] "

# Hostname
set -g @iconFG3 "#eed40e"
set -ag status-right "#[fg=#{@modBG}]#[fg=#{@iconFG3},bg=#{@modBG}]󰒋 #[fg=#{@txtFG},bg=#{@modBG}]#h#[fg=#{@modBG},bg=default] "

# Window formatting
set -g @winBGActive "#ab5dac"
set -g @winBGInactive "#3a3c4e"
set -g @numberFG "#bfbfbf"
set -g window-status-current-format "#[bold,fg=#{@winBGActive}]#[fg=#{@numberFG},bg=#{@winBGActive}]#I #[fg=#{@txtFG},bg=#{@winBGInactive}] #W#[fg=#{@winBGInactive},bg=default] "
set -g window-status-format "#[fg=#292929]#[fg=#{@numberFG},bg=#292929]#I #[fg=#{@txtFG},bg=#{@winBGInactive}] #W#[fg=#{@winBGInactive},bg=default] "

# Messages and mode styles
set -g message-style "bg=#020202,fg=#1c8984,bold"
set -g mode-style "bg=#36504b,fg=#ffffff"

# Pane border styles
set -g pane-border-style fg=gray
set -g pane-active-border-style "fg=#16a6ca"


# Initialize TMUX Plugin Manager (TPM)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Run TPM
run '~/.tmux/plugins/tpm/tpm'
