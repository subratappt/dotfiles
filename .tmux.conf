# Unbind default prefix and set a new prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Enable mouse support
set -g mouse on

#
set -gq allow-passthrough on
set -g visual-activity off
# set-environment -g DISPLAY $DISPLAY
# Automatically set DISPLAY when attaching
# set-hook -g after-attach "run-shell 'export DISPLAY=$(tmux show-environment | grep -oP "^DISPLAY=\K.*")'"
# set-hook -g client-attached 'send-keys "export DISPLAY=$(tmux show-environment | grep -oP \"^DISPLAY=\\K.*\")" C-L C-m'

# Use vi-style key bindings
set -g mode-keys vi

# Increase history limit
set -g history-limit 30000

# Start windows and panes at 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Reduce escape time delay for responsiveness
set -s escape-time 0

# Open new panes in the current directory
bind % split-window -v -c "#{pane_current_path}"
bind '"' split-window -h -c "#{pane_current_path}"


# Copy-mode vi bindings
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# To restore session
set -g @continuum-restore 'on'

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

bind C-l send-keys 'C-l'

# Pane resizing using Option + hjkl (macOS) or Alt + hjkl (Linux)
# Compatible with nvim
bind -n M-h if-shell "$is_vim" 'send-keys M-h'  'resize-pane -L 5'
bind -n M-j if-shell "$is_vim" 'send-keys M-j'  'resize-pane -D 5'
bind -n M-k if-shell "$is_vim" 'send-keys M-k'  'resize-pane -U 5'
bind -n M-l if-shell "$is_vim" 'send-keys M-l'  'resize-pane -R 5'

bind -n M-Left  resize-pane -L 5
bind -n M-Down  resize-pane -D 5
bind -n M-Up    resize-pane -U 5
bind -n M-Right resize-pane -R 5




# Default status line style
set -g status-style default

# Status line lengths
set -g status-right-length 100
set -g status-left-length 100

# Custom status line modules
# Session
set -g @modBG "#3a3c4e"
set -g @iconFG2 "#16a6ca"
set -g @txtFG "#eaeaea"
set -g status-left "#[fg=#{@modBG}] #[fg=#{@iconFG2},bg=#{@modBG}] #[fg=#{@txtFG},bg=#{@modBG}] #S #[fg=#{@modBG},bg=default] "

# Directory
set -g @iconFG1 "#3ed80f"
set -g status-right "#[fg=#{@modBG}]#[fg=#{@iconFG1},bg=#{@modBG}]#[fg=#{@txtFG},bg=#{@modBG}] #{b:pane_current_path} #[fg=#{@modBG},bg=default] "

# Hostname
set -g @iconFG3 "#eed40e"
set -ag status-right "#[fg=#{@modBG}]#[fg=#{@iconFG3},bg=#{@modBG}]󰒋 #[fg=#{@txtFG},bg=#{@modBG}]#h#[fg=#{@modBG},bg=default] "

# Window formatting
set -g @winBGActive "#ab5dac"
set -g @winBGInactive "#3a3c4e"
set -g @numberFG "#bfbfbf"
set -g window-status-current-format "#[bold,fg=#{@winBGActive}]#[fg=#{@numberFG},bg=#{@winBGActive}]#I #[fg=#{@txtFG},bg=#{@winBGInactive}] #W#[fg=#{@winBGInactive},bg=default] "
set -g window-status-format "#[fg=#292929]#[fg=#{@numberFG},bg=#292929]#I #[fg=#{@txtFG},bg=#{@winBGInactive}] #W#[fg=#{@winBGInactive},bg=default] "

# Messages and mode styles
set -g message-style "bg=#020202,fg=#1c8984,bold"
set -g mode-style "bg=#36504b,fg=#ffffff"

# Pane border styles
set -g pane-border-style fg=gray
set -g pane-active-border-style "fg=#16a6ca"


# Initialize TMUX Plugin Manager (TPM)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Run TPM
run '~/.tmux/plugins/tpm/tpm'
